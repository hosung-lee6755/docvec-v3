# 전체 점검 2-9 (2026-11-16). push와 pull request마다 백엔드 테스트와 프런트 검사를 돌린다.
#
# 백엔드는 api 컨테이너와 같은 이미지(Dockerfile의 development 단계, torch 없음)를 만들어 그 안에서
# pytest를 돌린다. 로컬에서 쓰는 방식과 같아서 "내 자리에서는 되는데"가 줄어든다. 테스트는
# localhost의 Postgres(docvec_test)와 Redis만 쓴다. Qdrant, MinIO, 추론 서버는 테스트가 흉내 낸다.
# GPU가 필요한 문서 처리 전체 흐름은 여기서 돌리지 않는다. 배포 전에 scripts/e2e_smoke.mjs로 확인한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docvec
          # 테스트 전용 DB의 값이다. backend/tests/conftest.py의 TEST_DATABASE_URL과 같아야 한다
          POSTGRES_PASSWORD: docvec_secret
          POSTGRES_DB: docvec_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docvec"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: development
          load: true
          tags: docvec-api-ci:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Make the test environment file
        # .env.example에는 줄 끝 주석과 따옴표가 있다. docker --env-file은 그것을 값으로 읽으므로 걷어 낸다
        run: |
          sed -e '1s/^\xEF\xBB\xBF//' .env.example \
            | grep -v '^\s*#' | grep '=' \
            | sed -E 's/[[:space:]]+#.*$//' \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' > ci.env

      - name: Run tests with coverage
        run: |
          docker run --rm --network host --env-file ci.env \
            -e COVERAGE_FILE=/tmp/.coverage \
            docvec-api-ci:latest \
            poetry run pytest -q -p no:cacheprovider tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 프런트 이미지(frontend/Dockerfile)와 같은 방식으로 설치한다
      - run: npm install --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build
