# Project_3(v3 개발 스택) — Project_2(운영·데모 스택)와 같은 PC에서 동시에 떠도 충돌하지 않도록
# 프로젝트명·네트워크명을 분리하고 호스트 포트를 Project_2 + 10000 으로 옮겼다.
name: project_3

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docvec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-docvec}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15433:5432"  # 로컬 전용 — 외부 접속 불가(DBeaver는 SSH 터널)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docvec}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:16380:6379"  # Bind to localhost only (internal use)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2  # 기존 스토리지가 만들어진 버전으로 고정 (was: latest)
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:16335:6333"  # Bind to localhost only (internal use)
      - "127.0.0.1:16336:6334"  # Bind to localhost only (internal use)
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z  # 기존 스토리지가 만들어진 버전으로 고정 (was: latest)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:19002:9000"  # 로컬 전용 — 외부는 Caddy가 /originals·/artifacts 로 중계
      - "127.0.0.1:19003:9001"  # 로컬 전용
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER?set POSTGRES_USER}:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB?set POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MINIO_ENDPOINT=minio:9000
      # Browser-facing presigned URLs must use the HOST-mapped port (19002 in
      # this project's remapped port set), not the internal service port.
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:19002}
      - MINIO_PUBLIC_SECURE=${MINIO_PUBLIC_SECURE:-false}
      - MINIO_RELATIVE_URLS=${MINIO_RELATIVE_URLS:-false}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER?set MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD?set MINIO_ROOT_PASSWORD}
      - SECRET_KEY=${SECRET_KEY?set SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY?set ENCRYPTION_KEY}
      # v3 마일스톤 3: 사내 AD(LDAP) 로그인과 디렉터리 동기화. 기본값은 꺼짐
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_START_TLS=${LDAP_START_TLS:-false}
      - LDAP_TLS_VERIFY=${LDAP_TLS_VERIFY:-true}
      - LDAP_CA_CERT_FILE=${LDAP_CA_CERT_FILE:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_GROUP_BASE_DN=${LDAP_GROUP_BASE_DN:-}
      - LDAP_ADMIN_GROUP_DN=${LDAP_ADMIN_GROUP_DN:-}
      - LDAP_SYNC_INTERVAL_MINUTES=${LDAP_SYNC_INTERVAL_MINUTES:-15}
      - ADMIN_SIGNUP_CODE=${ADMIN_SIGNUP_CODE:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ENVIRONMENT=production
      - HF_HOME=/model_cache
    volumes:
      # Bind mount for dev workflow (hot reload, file inspection)
      - ./backend:/app
      - backend_venv:/app/.venv
      - model_cache:/model_cache
    ports:
      - "127.0.0.1:18001:8000"  # 로컬 전용(외부는 Caddy→frontend→/api)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      bash -c "poetry run alembic upgrade head &&
               poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=127.0.0.1,172.16.0.0/12"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER?set POSTGRES_USER}:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB?set POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER?set MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD?set MINIO_ROOT_PASSWORD}
      - SECRET_KEY=${SECRET_KEY?set SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY?set ENCRYPTION_KEY}
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_START_TLS=${LDAP_START_TLS:-false}
      - LDAP_TLS_VERIFY=${LDAP_TLS_VERIFY:-true}
      - LDAP_CA_CERT_FILE=${LDAP_CA_CERT_FILE:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_GROUP_BASE_DN=${LDAP_GROUP_BASE_DN:-}
      - LDAP_ADMIN_GROUP_DN=${LDAP_ADMIN_GROUP_DN:-}
      - LDAP_SYNC_INTERVAL_MINUTES=${LDAP_SYNC_INTERVAL_MINUTES:-15}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ENVIRONMENT=production
      - HF_HOME=/model_cache
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
      - model_cache:/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: poetry run celery -A app.pipeline.celery_app worker --loglevel=info --concurrency=4 -Q critical,high,normal,low

  # GPU 임베딩 블록(chunk_split의 semantic 전략, rag_store) 전용 워커 — concurrency=1로
  # 고정해 같은 GPU를 여러 태스크가 동시에 점유해 서로 밀어내는 경합을 막는다
  # (사용자 확인 2026-07-21, "지금 문서를 한번에 처리해서 그러는거 같은데. 한건식
  # 차례로 처리하면 되는거 아닌가?"). 'embed' 큐 라우팅은 app/pipeline/tasks/workflow.py
  # 의 step_queue_for_block()이 담당.
  worker-embed:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER?set POSTGRES_USER}:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB?set POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER?set MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD?set MINIO_ROOT_PASSWORD}
      - SECRET_KEY=${SECRET_KEY?set SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY?set ENCRYPTION_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ENVIRONMENT=production
      - HF_HOME=/model_cache
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
      - model_cache:/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: poetry run celery -A app.pipeline.celery_app worker --loglevel=info --concurrency=1 -Q embed

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # Basic auth (username:password) — must be set in .env
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH?set FLOWER_BASIC_AUTH}
    ports:
      - "127.0.0.1:15556:5555"  # 로컬 전용
    depends_on:
      redis:
        condition: service_healthy
    command: poetry run celery -A app.pipeline.celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH?set FLOWER_BASIC_AUTH}

  # sweep_stuck_workflow_runs를 30초마다 실행해, 문서 상세 페이지를 아무도
  # 열어보지 않아도 timeout+grace를 넘긴 run을 스스로 FAILED로 정리한다
  # (app/pipeline/celery_app.py의 beat_schedule 참고). DB/Celery 브로커에만
  # 접근하면 되므로 worker와 달리 GPU/Qdrant/MinIO 자격증명은 필요 없다.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER?set POSTGRES_USER}:${POSTGRES_PASSWORD?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB?set POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY?set SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY?set ENCRYPTION_KEY}
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_START_TLS=${LDAP_START_TLS:-false}
      - LDAP_TLS_VERIFY=${LDAP_TLS_VERIFY:-true}
      - LDAP_CA_CERT_FILE=${LDAP_CA_CERT_FILE:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_GROUP_BASE_DN=${LDAP_GROUP_BASE_DN:-}
      - LDAP_ADMIN_GROUP_DN=${LDAP_ADMIN_GROUP_DN:-}
      - LDAP_SYNC_INTERVAL_MINUTES=${LDAP_SYNC_INTERVAL_MINUTES:-15}
      - ENVIRONMENT=production
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: poetry run celery -A app.pipeline.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api

  # 외부 노출용 단일 진입점 — 공유기 포트포워딩은 443(그리고 http->https
  # 리다이렉트용 80) 하나만 열면 된다. 도메인이 없어 Caddyfile은 자체 서명
  # 인증서("tls internal")를 쓴다 — 방문자 브라우저에 "안전하지 않음" 경고가
  # 뜨는 게 정상이며, 접속 자체는 암호화된다. postgres/redis/qdrant/minio/
  # flower·api의 호스트 포트는 127.0.0.1에만 바인딩돼 있다(2026-10-12). 공유기에서는
  # 이 서비스의 443/80 외 어떤 포트도 포워딩하면 안 된다.
  caddy:
    image: caddy:2.8.4-alpine  # Pin to exact version (was: 2-alpine)
    ports:
      - "13443:443"  # v3 개발 스택 — Project_2의 443·4443·3001과 겹치지 않는 포트
      - "13080:80"
    environment:
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:19002}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - minio

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  backend_venv:
  worker_venv:
  model_cache:
  caddy_data:
  caddy_config:

networks:
  default:
    name: project3_net
