server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (HSTS omitted on HTTP — added by Caddy HTTPS layer instead)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";

        # nginx 기본 mime.types 에는 .mjs 가 없어 application/octet-stream 으로 나갔다. nosniff 때문에 브라우저가
        # PDF.js 작업 파일(pdf.worker.min-*.mjs)을 스크립트로 실행하지 않아, 원문 대조의 배율 뷰어가 잠깐 보였다가
        # 브라우저 PDF 뷰어로 넘어갔다(2026-11-27). .mjs 는 자바스크립트로 보낸다.
        location ~ \.mjs$ {
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location /api/ {
        client_max_body_size 100m;
        # api 컨테이너가 재생성되면 IP가 바뀐다. 기동 시점 IP를 고정하지 않도록 Docker DNS로 매 요청(10초 캐시) 재조회한다.
        # 변수를 쓰면 URI 치환이 없어 요청 경로(/api/...)가 그대로 전달된다.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
